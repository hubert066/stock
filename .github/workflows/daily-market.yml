name: Daily Taiwan and US market dashboard

on:
  schedule:
    # Taiwan time (UTC+8): weekdays 09:15, 09:25 (retry), 13:40 and 17:45 (retry)
    - cron: '15 1 * * 1-5'
    - cron: '25 1 * * 1-5'
    - cron: '40 5 * * 1-5'
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Publish session report
        env:
          MARKET_CRON: ${{ github.event.schedule }}
        run: |
          case "$MARKET_CRON" in
            '15 1 * * 1-5'|'25 1 * * 1-5') python scripts/update_reports.py opening ;;
            '40 5 * * 1-5'|'45 9 * * 1-5') python scripts/update_reports.py closing ;;
            *) python scripts/update_reports.py ;;
          esac
      - name: Update original market data
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/reports
          if ! git diff --cached --quiet; then
            git commit -m "data: update daily market snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
